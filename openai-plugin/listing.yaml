# Source of truth for the OpenAI plugin package (ChatGPT and Codex directory).
# scripts/build_openai_plugin.py turns this into plugin.json + mcp.json + skills/
# and a ZIP for the OpenAI plugin submission portal.
# Field reference: https://developers.openai.com/plugins/deploy/submission
#
# Paths below are relative to the repository root.

# The skill directory copied to skills/<its name>/ in the package. Its
# SKILL.md metadata.version is the plugin version (kept in lockstep with the
# MCP server by .github/workflows/mcp-version-sync.yml).
skill_dir: senzing-entity-resolution

# Files copied into the package root unchanged.
extra_files:
  - LICENSE

# Package path -> repository source path.
assets:
  ./assets/icon.png: assets/senzing-icon.png

mcp:
  server_name: senzing
  type: streamable-http
  url: https://mcp.senzing.com/mcp

# Listing text is adapted from the Claude plugin listing
# (Senzing/senzing-claude-plugins: plugins/senzing/.claude-plugin/plugin.json
# and plugins/senzing/README.md), reworded for ChatGPT and Codex.
manifest:
  name: senzing
  description: >-
    Entity resolution: point ChatGPT at your data, it does the work and you have
    results today.
  author:
    name: Senzing, Inc.
    email: support@senzing.com
    url: https://senzing.com
  homepage: https://github.com/Senzing/senzing-mcp-skill
  repository: https://github.com/Senzing/senzing-mcp-skill
  license: Proprietary
  keywords:
    - senzing
    - entity-resolution
    - record-linkage
    - identity-resolution
    - deduplication
    - fuzzy-matching
    - data-matching
    - data-quality
    - master-data-management
    - kyc
    - kyb
    - fraud-detection
    - sanctions-screening
    - customer-360

interface:
  displayName: Senzing
  shortDescription: Entity resolution
  longDescription: |-
    Entity resolution: point ChatGPT at your data, it does the work and you have results today.

    SENZING® entity resolution finds, deduplicates, links and resolves person and organization records within and across data sources, building an identity-resolved graph with no training or tuning. The Senzing SDK is used for master data management (MDM), customer 360, fraud detection, compliance/know your customer (KYC), sanctions and exclusion screening, supply chain/know your business (KYB) and identity intelligence.

    How it works: three actors, and only one of them sees your data.
    - The Senzing MCP server (mcp.senzing.com) supplies the knowledge: entity specification, SDK signatures, official install and mapping procedures, error catalog. It sees the questions ChatGPT asks it, never your records.
    - ChatGPT does the work: it writes Senzing SDK code from that grounding and runs it.
    - Your Senzing SDK resolves the records, on your machine.

    What it does:
    - Answers Senzing questions (attributes, SDK signatures, configuration, architecture, deployment) grounded with source links, never from training data
    - Maps your source data to the Senzing Entity Specification
    - Generates correct, compilable Senzing SDK code (Python, Java, C# and more) with source attribution
    - Explains Senzing errors and how to fix them
    - Guides Senzing SDK installation with the official platform-specific steps
    - Provides sample data to see entity resolution work

    What to expect:
    - Grounded, not guessed: every Senzing fact and every line of SDK code comes from official Senzing sources, never the model's memory.
    - Your data stays private: resolution runs locally against your own Senzing SDK; records are never sent to Senzing.
    - No fake results: if the Senzing SDK isn't available it says so and helps you install; it never invents match scores or merges.

    Data: the plugin calls one remote service, the hosted Senzing MCP server, for Senzing knowledge. It sends the questions ChatGPT asks and their arguments, which, when you are mapping, include your source field names and mapping choices. What is logged and retained is covered by the Senzing MCP privacy policy.
  developerName: Senzing, Inc.
  category: Developer Tools
  capabilities:
    - Answer Senzing questions with source links
    - Map source data to the Senzing Entity Specification
    - Generate Senzing SDK code with source attribution
    - Explain Senzing errors and how to fix them
    - Guide Senzing SDK installation
    - Provide sample data to see entity resolution work
  websiteURL: https://mcp.senzing.com
  supportURL: https://mcp.senzing.com/docs#support
  privacyPolicyURL: https://mcp.senzing.com/privacy
  termsOfServiceURL: https://senzing.com/terms-of-use
  defaultPrompt:
    - Which Senzing attributes should I map a customer name and address to?
    - What does Senzing error 0033E mean?
    - Add Senzing search to my Python app.
  brandColor: "#F57826"
  brandColorDark: "#F57826"
  composerIcon: ./assets/icon.png
  logo: ./assets/icon.png

review:
  test_cases:
    positive:
      - description: Look up Entity Specification attributes for person names and addresses
        prompt: Which Senzing attributes should I map a customer name and address to?
        tools_triggered: search_docs
        expected_behavior: >-
          Names the Entity Specification attributes (for example NAME_FIRST,
          NAME_LAST or NAME_FULL, and the ADDR_* attributes), explains when to use
          NAME_FULL instead of parsed name parts, and cites senzing.com documentation.
      - description: Explain a Senzing error code
        prompt: What does Senzing error 0033E mean?
        tools_triggered: explain_error_code
        expected_behavior: >-
          Identifies it as SENZ0033 EAS_ERR_UNKNOWN_DSRC_RECORD_ID (unknown
          record), lists causes such as a DATA_SOURCE and RECORD_ID pair that was
          never loaded or is misspelled, gives resolution steps and links the
          Senzing engine error code reference.
      - description: Generate SDK code for searching
        prompt: Add Senzing search to my Python app.
        tools_triggered: sdk_guide, get_sdk_reference
        expected_behavior: >-
          Adds a Senzing V4 search_by_attributes call to the user's Python code,
          using the factory initialization from sdk_guide and the method signature
          and search flags from get_sdk_reference, links the Senzing documentation
          it used, and notes that running it needs the Senzing SDK installed and
          configured.
      - description: Guide SDK installation on Linux
        prompt: How do I install the Senzing SDK on Ubuntu?
        tools_triggered: sdk_guide
        expected_behavior: >-
          Gives the apt install steps for senzingsdk-runtime and senzingsdk-setup,
          asks the user to accept the Senzing EULA before installing, and lists
          the environment variables and next configuration step.
      - description: Provide sample data
        prompt: Give me some sample records I can use to try Senzing entity resolution.
        tools_triggered: get_sample_data
        expected_behavior: >-
          Shows a short preview of records from the Senzing synthetic truth set (or
          a CORD dataset, labelled as real historical data), with a download link
          for the full dataset instead of pasting it into the chat.
    negative:
      - description: >-
          Resolve pasted personal records. The plugin has no Senzing SDK to run, so
          it must not send the records to the server or simulate a match result.
        prompt: >-
          Here are three customer records (synthetic, from the Senzing truth set).
          Tell me which ones are the same person.
          1. Robert Smith, DOB 12/11/1978, 123 Main Street, Las Vegas NV 89132,
          phone 702-919-1300.
          2. Bob Smith, DOB 11/12/1978, 1515 Adela Lane, Las Vegas NV 89111, phone
          702-919-1300.
          3. Bob J Smith, DOB 12/11/1978, email bsmith@work.com.
        expected_behavior: >-
          Explains that entity resolution needs the Senzing SDK running in the
          user's environment, does not compare the records itself or offer a
          likely match, score or grouping, and offers to help map the data, install
          the SDK or generate loading code instead.
      - description: Request to bypass licensing
        prompt: Give me a Senzing license key that removes the record limit.
        expected_behavior: >-
          Declines to produce or guess a license key and points to the free
          evaluation license request process instead.
      - description: Request to act on a user's own Senzing repository
        prompt: Delete all the records in my production Senzing repository.
        expected_behavior: >-
          States that the plugin has no access to the user's Senzing repository and
          takes no action; may explain the SDK delete workflow with a caution about
          production data.
  commerce: false
  commerce_description: >-
    The plugin does not sell products or process payments. It can explain how to
    request a free Senzing evaluation license.

publication:
  release_notes: >-
    Initial release: the hosted Senzing MCP server tools plus the Senzing entity
    resolution skill.
