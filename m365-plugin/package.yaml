# Source of truth for the Microsoft 365 / Microsoft Copilot app package
# (Partner Center: Marketplace offers -> senzing -> Packages).
# scripts/build_m365_plugin.py turns this and agent.yaml into manifest.json,
# declarativeAgent.json, ai-plugin.json, the icons, the MCP tool description
# file and skills/, plus a deterministic ZIP.
#
# Paths below are relative to the repository root.

# The skill directory copied to skills/<its name>/ in the package.
skill_dir: senzing-entity-resolution

# The app version (manifest.json version, MAJOR.MINOR.PATCH). It is separate
# from the skill's metadata.version: Teams and Partner Center need a higher
# version for every package update, so bump it whenever the package changes.
app_version: 1.47.9

# The ZIP is <package_name>-<app_version>.zip.
package_name: senzing-m365-plugin

# Never change this id: Teams and Partner Center tie app updates to it.
app_id: c47a1241-83c4-459f-9e91-09f7f36de642

developer:
  name: Senzing, Inc.
  # Same domain as privacyUrl (clears DeveloperPrivacyUrlOnDifferentDomainThanWebsiteUrl).
  websiteUrl: https://mcp.senzing.com
  privacyUrl: https://mcp.senzing.com/privacy
  termsOfUseUrl: https://senzing.com/terms-of-use

name:
  short: Senzing
  full: Senzing

accent_color: "#F57826"

# Copied to the package root. Microsoft certification requires the outline
# icon to be the color icon's shape, white on transparent.
icons:
  color: m365-plugin/icons/color.png
  outline: m365-plugin/icons/outline.png

# Sign-up, get started, contact and help links (Microsoft store validation guideline).
links:
  sign_up: https://senzing.com/try-senzing/
  get_started: https://mcp.senzing.com/docs
  help: https://senzing.com/docs/
  contact: https://senzing.com/contact/
  support_email: support@senzing.com

description:
  # Every mention of Copilot must be "Microsoft Copilot" (Microsoft store validation guideline).
  short: "Entity resolution in Microsoft Copilot: map data, generate SDK code, fix errors"
  # Paragraphs, joined with blank lines. {name} placeholders are filled from
  # the links block.
  full:
    - "Entity resolution in Microsoft Copilot: answers, data mapping and SDK code, grounded in official sources."
    - >-
      SENZING® entity resolution finds, deduplicates, links and resolves person
      and organization records within and across data sources, building an
      identity-resolved graph with no training or tuning. The Senzing SDK is
      used for master data management (MDM), customer 360, fraud detection,
      compliance/know your customer (KYC), sanctions and exclusion screening,
      supply chain/know your business (KYB) and identity intelligence.
    - |-
      How it works: three actors, and only one of them sees your data.
      - The Senzing MCP server (mcp.senzing.com) supplies the knowledge: entity specification, SDK signatures, official install and mapping procedures, error catalog. It sees the questions Microsoft Copilot asks it, never your records.
      - Microsoft Copilot answers and writes Senzing SDK code from that grounding.
      - Your Senzing SDK resolves the records, in your own environment.
    - |-
      What it does:
      - Answers Senzing questions (attributes, SDK signatures, configuration, architecture, deployment) grounded with source links, never from training data
      - Maps your source data to the Senzing Entity Specification
      - Shows Senzing SDK code (Python, Java, C# and more) from official examples, with source attribution
      - Explains Senzing errors and how to fix them
      - Guides Senzing SDK installation with the official platform-specific steps
      - Provides sample data to see entity resolution work
    - |-
      What to expect:
      - Grounded, not guessed: every Senzing fact and every line of SDK code comes from official Senzing sources, never the model's memory.
      - Your data stays private: entity resolution runs in your own environment with your own Senzing SDK; records are never sent to Senzing.
      - No fake results: it never invents match scores or merges.
    - >-
      Data: the app calls one remote service, the hosted Senzing MCP server,
      for Senzing knowledge. It sends the questions Microsoft Copilot asks and
      their arguments, which, when you are mapping, include your source field
      names and mapping choices. What is logged and retained is covered by the
      Senzing MCP privacy policy.
    - >-
      How to use: in Microsoft Copilot, open Agents and choose Senzing, then
      pick a suggested prompt or ask a Senzing question.
    - >-
      Sign up: no account is needed to use this app. To run entity resolution
      on your own data, get the Senzing SDK at {sign_up}
    - "Get started: {get_started}"
    - "Help and documentation: {help}"
    - "Contact us: {contact} or {support_email}"

# The anonymous remote Senzing MCP server. The package exposes it twice, the
# same way the OpenAI plugin pairs mcp.json with the skill:
#   connector: manifest agentConnectors, with every tool from the live
#     tools/list (tool_file), next to the skill in agentSkills;
#   the agent's action: ai-plugin.json runtime, with the agent's tools
#     (agent_tool_file; agent.yaml excludes some) and one function per tool.
mcp_server:
  url: https://mcp.senzing.com/mcp
  tool_file: tools/senzing-tools.json
  agent_tool_file: tools/senzing-agent-tools.json
  connector:
    id: senzing
    displayName: Senzing MCP server
    description: >-
      Senzing documentation, entity specification, SDK signatures and examples,
      data mapping workflows, error explanations and sample data.
