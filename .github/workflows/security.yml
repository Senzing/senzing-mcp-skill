---
name: Security

# Dependency audit for the Python build/test dependencies in
# requirements-dev.txt (pyyaml, jsonschema, pytest, pytest-cov, ruff). They run
# in CI and in the release path that builds the OpenAI plugin ZIP, so a
# vulnerable or malicious one reaches a published artifact.
#
# This is the Python counterpart to the `cargo audit` / `cargo vet` jobs in the
# Rust repos. pip-audit queries the Python Packaging Advisory Database (PyPA)
# plus OSV for every pinned version.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Advisories are published against versions we already have pinned, so a
    # clean PR run goes stale. Re-check daily against a fresh database.
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pip-audit:
    name: pip-audit (requirements-dev.txt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Pinned like every other tool here: an unpinned audit tool is itself an
      # unreviewed dependency, and a silent major bump would change what the
      # gate means.
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      # --strict fails on a dependency pip-audit cannot resolve, so a typo or a
      # renamed package cannot pass as "no known vulnerabilities".
      - name: Audit the pinned dependencies
        run: pip-audit --strict --requirement requirements-dev.txt
