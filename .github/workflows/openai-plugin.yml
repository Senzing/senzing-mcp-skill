name: OpenAI plugin

# Validates and builds the OpenAI plugin package (ChatGPT and Codex directory)
# from openai-plugin/listing.yaml and the skill. The ZIP is a workflow artifact
# on every run. On a push to main whose plugin version has no GitHub release yet,
# it creates release v<version> with the ZIP attached: upload that ZIP to the
# OpenAI plugin submission portal (OpenAI has no upload API). A release published
# by hand also gets the ZIP attached.

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openai-plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build the OpenAI plugin ZIP
    runs-on: ubuntu-latest
    permissions:
      contents: write # release asset upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check scripts tests
          ruff format --check scripts tests

      - name: Test (100% coverage, live schema and MCP contract checks)
        run: pytest

      - name: Build ZIP
        id: build
        run: |
          set -euo pipefail
          ZIP=$(python scripts/build_openai_plugin.py \
            --listing openai-plugin/listing.yaml \
            --limits openai-plugin/limits.yaml \
            --repo-root . \
            --out-dir dist)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openai-plugin
          path: ${{ steps.build.outputs.zip }}
          if-no-files-found: error

      - name: Create release for a new plugin version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.build.outputs.zip }}
          TARGET: ${{ github.sha }}
        run: scripts/release_openai_plugin.sh "$ZIP" "$TARGET"

      - name: Attach ZIP to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.build.outputs.zip }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "$ZIP" --clobber
